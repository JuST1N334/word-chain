<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>成语接龙挑战</title>
<style>
  :root {
    --brand: #0f766e;
    --brand-light: #14b8a6;
    --bg-grad: linear-gradient(135deg, #e0f2fe 0%, #ccfbf1 50%, #fef3c7 100%);
    --danger: #e11d48;
  }
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg-grad);
    background-attachment: fixed;
    overflow: hidden;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 580px;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.9);
    border-radius: 28px;
    padding: 32px 28px;
    box-shadow: 0 24px 60px rgba(15, 118, 110, 0.15);
    display: flex;
    flex-direction: column;
    min-height: 400px;
  }

  .header-area {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }
  h1 { margin: 0; font-size: 22px; color: var(--brand); letter-spacing: 2px; }
  .timer-box {
    font-size: 18px; font-weight: bold; color: var(--brand);
    background: rgba(20, 184, 166, 0.1); padding: 6px 16px;
    border-radius: 999px; transition: all 0.3s;
  }
  .timer-box.danger {
    color: var(--danger); background: rgba(225, 29, 72, 0.1);
    animation: pulse 1s infinite;
  }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }

  .question-area {
    text-align: center; margin-bottom: 20px; flex: 1;
    display: flex; flex-direction: column; justify-content: center;
  }
  .current-idiom {
    font-size: 42px; font-weight: bold; color: #1f2937;
    letter-spacing: 8px; margin: 0 0 10px;
    text-shadow: 2px 2px 0 rgba(255, 255, 255, 0.8);
    transition: opacity 0.3s;
  }
  .target-char { font-size: 18px; color: #6b7280; margin: 0; }
  .target-char span { color: var(--brand-light); font-weight: bold; font-size: 22px; }

  .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
  input {
    flex: 1; padding: 16px 20px; font-size: 18px; font-family: inherit;
    border: 2px solid #e5e7eb; border-radius: 16px; outline: none; background: #fff;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input:focus {
    border-color: var(--brand-light);
    box-shadow: 0 0 0 4px rgba(20, 184, 166, 0.15);
  }
  input:disabled { background: #f3f4f6; cursor: not-allowed; }
  input.shake { animation: shake 0.35s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  button {
    border: none; cursor: pointer; font-family: inherit; font-weight: 600;
    color: #fff; background: linear-gradient(135deg, var(--brand), var(--brand-light));
    border-radius: 16px; transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 15px rgba(20, 184, 166, 0.3);
  }
  button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(20, 184, 166, 0.4); }
  button:active:not(:disabled) { transform: translateY(0); }
  button:disabled { opacity: 0.6; cursor: not-allowed; box-shadow: none; }
  .submit-btn { padding: 0 32px; font-size: 18px; }

  .answer-panel {
    background: #fefce8; border: 2px dashed #fde047; border-radius: 16px;
    padding: 20px; text-align: center; margin-bottom: 20px;
    display: none; animation: slideUp 0.3s ease-out;
  }
  .answer-panel.show { display: block; }
  .answer-panel.error { background: #fff1f2; border-color: #fda4af; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .answer-title { font-size: 14px; color: #ca8a04; margin-bottom: 8px; font-weight: bold; }
  .answer-panel.error .answer-title { color: #e11d48; }
  .ref-idiom { font-size: 28px; font-weight: bold; color: #854d0e; letter-spacing: 4px; margin-bottom: 12px; }
  .ref-meaning { font-size: 14px; color: #6b7280; line-height: 1.5; }

  .overlay {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px);
    z-index: 100; display: flex; flex-direction: column;
    align-items: center; justify-content: center; border-radius: 28px;
    opacity: 0; visibility: hidden; transition: opacity 0.3s;
  }
  .overlay.show { opacity: 1; visibility: visible; }
  .overlay h2 { font-size: 32px; color: var(--brand); margin-bottom: 10px; letter-spacing: 4px;}
  .overlay p { color: #6b7280; margin-bottom: 30px; font-size: 16px; text-align: center; }
  .start-btn { padding: 16px 48px; font-size: 20px; border-radius: 999px; letter-spacing: 2px; }

  .toast {
    position: absolute; top: 20px; left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: #10b981; color: white; padding: 10px 24px;
    border-radius: 999px; font-size: 16px; font-weight: bold;
    opacity: 0; transition: all 0.3s; pointer-events: none;
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); z-index: 200;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  .toast.error { background: var(--danger); box-shadow: 0 4px 12px rgba(225, 29, 72, 0.3); }

  @media (max-width: 480px) {
    .current-idiom { font-size: 32px; letter-spacing: 4px; }
    .card { padding: 24px 20px; }
    .submit-btn { padding: 0 20px; font-size: 16px; }
  }
</style>
</head>
<body>

<div class="card" id="gameCard">
  <div class="header-area">
    <h1>成语接龙</h1>
    <div class="timer-box" id="timerBox">⏱ 10s</div>
  </div>

  <div class="question-area">
    <h2 class="current-idiom" id="currentIdiom">---</h2>
    <p class="target-char">请接以 <span id="targetChar">-</span> 开头的成语</p>
  </div>

  <div class="answer-panel" id="answerPanel">
    <div class="answer-title" id="answerTitle">参考答案</div>
    <div class="ref-idiom" id="refIdiom">---</div>
    <div class="ref-meaning" id="refMeaning">---</div>
  </div>

  <div class="input-group">
    <input id="wordInput" type="text" placeholder="输入成语..." autocomplete="off" disabled />
    <button class="submit-btn" id="submitBtn" disabled>确认</button>
  </div>

  <!-- 开始界面 -->
  <div class="overlay show" id="startOverlay">
    <h2>成语接龙</h2>
    <p id="startText">正在加载词库，请稍候...</p>
    <button class="start-btn" id="startBtn" style="display: none;">Start</button>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
/* ================= 配置 ================= */
// 使用 chinese-xinhua 项目的 idiom.json，收录 31648 个成语
const IDIOM_DATA_URL = 'https://cdn.jsdelivr.net/gh/pwxcoo/chinese-xinhua@master/data/idiom.json';

/* ================= 状态变量 ================= */
let idiomMap = new Map(); // 成语 -> 释义
let startsWithMap = new Map(); // 首字 -> 成语数组
let idiomList = []; // 所有成语的数组
let currentQuestion = '';
let timerInterval = null;
let timeLeft = 10;
let isAnswering = false;
let isWaitingNext = false;
let usedIdioms = new Set();
let isDataReady = false;

/* ================= DOM 元素 ================= */
const currentIdiomEl = document.getElementById('currentIdiom');
const targetCharEl = document.getElementById('targetChar');
const timerBox = document.getElementById('timerBox');
const wordInput = document.getElementById('wordInput');
const submitBtn = document.getElementById('submitBtn');
const answerPanel = document.getElementById('answerPanel');
const answerTitle = document.getElementById('answerTitle');
const refIdiomEl = document.getElementById('refIdiom');
const refMeaningEl = document.getElementById('refMeaning');
const startOverlay = document.getElementById('startOverlay');
const startBtn = document.getElementById('startBtn');
const startText = document.getElementById('startText');
const toast = document.getElementById('toast');

/* ================= 工具函数 ================= */
function showToast(msg, isError = false) {
  toast.textContent = msg;
  toast.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

function updateTimerUI() {
  timerBox.textContent = `⏱ ${timeLeft}s`;
  if (timeLeft <= 3) {
    timerBox.classList.add('danger');
  } else {
    timerBox.classList.remove('danger');
  }
}

function startTimer(seconds, onTimeout) {
  clearInterval(timerInterval);
  timeLeft = seconds;
  updateTimerUI();
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerUI();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      onTimeout();
    }
  }, 1000);
}

/* ================= 数据加载与索引构建 ================= */
async function loadData() {
  try {
    const response = await fetch(IDIOM_DATA_URL);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();

    // 构建索引
    data.forEach(item => {
      const word = item.word;
      if (!word || word.length < 4) return; // 确保是四字成语

      // 释义：优先使用 explanation
      const meaning = item.explanation || '暂无释义';
      
      idiomMap.set(word, meaning);
      idiomList.push(word);

      const firstChar = word[0];
      if (!startsWithMap.has(firstChar)) startsWithMap.set(firstChar, []);
      startsWithMap.get(firstChar).push(word);
    });

    isDataReady = true;
    startText.textContent = `词库加载完成（共收录 ${idiomList.length} 个成语）`;
    startBtn.style.display = 'inline-block';

  } catch (error) {
    console.error('词库加载失败:', error);
    startText.innerHTML = '词库加载失败，请刷新重试。<br><small style="font-size:12px;color:#999;">(将使用少量内置成语作为后备)</small>';
    startBtn.style.display = 'inline-block';
    // 后备数据（非常少，仅用于测试）
    const fallback = [
      { word: '一心一意', meaning: '形容心思、意念专一。' },
      { word: '意气风发', meaning: '形容精神振奋，气概豪迈。' },
      { word: '发扬光大', meaning: '使好的作风、传统等得到发展和提高。' },
      { word: '大显身手', meaning: '充分显示出本领和才能。' },
      { word: '手到擒来', meaning: '比喻做事有把握，不费力就做好了。' },
      { word: '来日方长', meaning: '将来的日子还长着呢。' },
    ];
    fallback.forEach(item => {
      idiomMap.set(item.word, item.meaning);
      idiomList.push(item.word);
      const firstChar = item.word[0];
      if (!startsWithMap.has(firstChar)) startsWithMap.set(firstChar, []);
      startsWithMap.get(firstChar).push(item.word);
    });
    isDataReady = true;
  }
}

/* ================= 游戏逻辑 ================= */
function nextQuestion() {
  // 随机抽取一个未使用过的成语作为题目
  let available = idiomList.filter(w => !usedIdioms.has(w));
  if (available.length === 0) {
    usedIdioms.clear();
    available = idiomList;
  }
  
  const randomWord = available[Math.floor(Math.random() * available.length)];
  currentQuestion = randomWord;
  usedIdioms.add(currentQuestion);

  currentIdiomEl.textContent = currentQuestion;
  targetCharEl.textContent = currentQuestion[currentQuestion.length - 1];
  currentIdiomEl.style.opacity = '1';

  answerPanel.classList.remove('show', 'error');
  wordInput.value = '';
  wordInput.disabled = false;
  submitBtn.disabled = false;
  wordInput.focus();

  isAnswering = true;
  isWaitingNext = false;

  startTimer(10, () => handleFailure('时间到！', true));
}

function handleFailure(reason, isTimeout = false) {
  if (!isAnswering) return;
  isAnswering = false;
  clearInterval(timerInterval);
  
  wordInput.disabled = true;
  submitBtn.disabled = true;

  const lastChar = currentQuestion[currentQuestion.length - 1];
  const nextList = startsWithMap.get(lastChar);
  
  let refWord = '暂无标准答案';
  let refMeaning = '词库中未找到能接上此字的成语。';
  
  if (nextList && nextList.length > 0) {
    const unusedRef = nextList.filter(w => !usedIdioms.has(w));
    refWord = unusedRef.length > 0 ? unusedRef[Math.floor(Math.random() * unusedRef.length)] : nextList[Math.floor(Math.random() * nextList.length)];
    refMeaning = idiomMap.get(refWord) || '暂无释义';
    usedIdioms.add(refWord); 
  }

  answerTitle.textContent = isTimeout ? '时间到！' : (reason || '回答错误！');
  answerPanel.classList.add('show');
  if (!isTimeout) answerPanel.classList.add('error');

  refIdiomEl.textContent = refWord;
  refMeaningEl.textContent = refMeaning;

  isWaitingNext = true;
  timeLeft = 5;
  updateTimerUI();
  timerBox.classList.remove('danger');
  
  let nextCountdown = setInterval(() => {
    timeLeft--;
    updateTimerUI();
    if (timeLeft <= 0) {
      clearInterval(nextCountdown);
      if (isWaitingNext) {
        currentQuestion = refWord; 
        if (refWord === '暂无标准答案') {
          nextQuestion();
        } else {
          targetCharEl.textContent = refWord[refWord.length - 1];
          currentIdiomEl.textContent = refWord;
          
          answerPanel.classList.remove('show');
          wordInput.disabled = false;
          submitBtn.disabled = false;
          wordInput.value = '';
          wordInput.focus();
          isAnswering = true;
          isWaitingNext = false;
          startTimer(10, () => handleFailure('时间到！', true));
        }
      }
    }
  }, 1000);
}

function submitAnswer() {
  if (!isAnswering) return;

  const inputVal = wordInput.value.trim();
  if (!inputVal) {
    showToast('请输入成语！', true);
    return;
  }

  const lastChar = currentQuestion[currentQuestion.length - 1];
  
  if (inputVal[0] !== lastChar) {
    showToast(`首字必须是「${lastChar}」！`, true);
    wordInput.classList.add('shake');
    setTimeout(() => wordInput.classList.remove('shake'), 400);
    return;
  }

  if (!idiomMap.has(inputVal)) {
    showToast('词库中无此成语哦，再试一次！', true);
    wordInput.classList.add('shake');
    setTimeout(() => wordInput.classList.remove('shake'), 400);
    return;
  }

  clearInterval(timerInterval);
  showToast('接得漂亮！');
  usedIdioms.add(inputVal);
  
  wordInput.disabled = true;
  submitBtn.disabled = true;
  setTimeout(() => {
    nextQuestion();
  }, 500);
}

/* ================= 事件绑定与初始化 ================= */
startBtn.addEventListener('click', () => {
  if (!isDataReady) return;
  startOverlay.classList.remove('show');
  usedIdioms.clear();
  nextQuestion();
});

submitBtn.addEventListener('click', submitAnswer);

wordInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') submitAnswer();
});

wordInput.addEventListener('input', () => {
  wordInput.classList.remove('shake');
});

// 页面加载时立即开始加载词库
window.addEventListener('load', loadData);
</script>
</body>
</html>
