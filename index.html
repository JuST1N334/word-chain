/* ---------------- 构建索引 ---------------- */
const index = new Map();
for (const w of RAW.trim().split(/\s+/)) {
  if (!w) continue;
  const first = Array.from(w)[0];
  if (!index.has(first)) index.set(first, []);
  const arr = index.get(first);
  if (!arr.includes(w)) arr.push(w);
}

/* ---------------- DOM ---------------- */
const inputEl = document.getElementById('wordInput');
const goBtn = document.getElementById('goBtn');
const chainEl = document.getElementById('chain');
const hintEl = document.getElementById('hint');
const nextBtn = document.getElementById('nextBtn');
const resetBtn = document.getElementById('resetBtn');

let nodes = [];        // [{word, who}]
let used = new Set();  // 已出现过的词，避免重复

/* ---------------- 工具函数 ---------------- */
const charsOf = (s) => Array.from(s);
const lastChar = (s) => { const c = charsOf(s); return c[c.length - 1]; };
const firstChar = (s) => charsOf(s)[0];

function normalize(s) {
  // 去掉空白与常见标点
  return (s || '').replace(/[\s，。、,.!！?？:：;；"'“”‘’()（）《》\-—]/g, '');
}

function hint(text, type) {
  hintEl.textContent = text || '';
  hintEl.className = 'hint' + (type ? ' ' + type : '');
}

/** 根据上一个词，挑一个能接得上的词 */
function pickNext(prevWord) {
  const key = lastChar(prevWord);
  const pool = (index.get(key) || []).filter(w => !used.has(w) && w !== prevWord);
  if (!pool.length) return null;

  // 优先挑选“自己还能继续接下去”的词，让接龙更有后劲
  const extendable = pool.filter(w => {
    const c = lastChar(w);
    return (index.get(c) || []).some(x => x !== w);
  });

  const list = extendable.length ? extendable : pool;
  return list[Math.floor(Math.random() * list.length)];
}

/* ---------------- 渲染 ---------------- */
function renderChain(animateLast = true) {
  chainEl.innerHTML = '';

  nodes.forEach((n, i) => {
    if (i > 0) {
      const arrow = document.createElement('div');
      arrow.className = 'arrow';
      arrow.textContent = '↓';
      chainEl.appendChild(arrow);
    }

    const node = document.createElement('div');
    node.className = 'node ' + n.who;
    if (animateLast && i === nodes.length - 1) node.classList.add('pop');

    const who = document.createElement('span');
    who.className = 'who';
    who.textContent = n.who === 'user' ? '你' : '电脑';

    const pill = document.createElement('span');
    pill.className = 'pill';
    pill.textContent = n.word;

    node.append(who, pill);
    chainEl.appendChild(node);
  });

  chainEl.scrollTop = chainEl.scrollHeight;

  const hasChain = nodes.length > 0;
  nextBtn.classList.toggle('hidden', !hasChain);
  resetBtn.classList.toggle('hidden', !hasChain);
}

/* ---------------- 主流程 ---------------- */
function startChain() {
  const raw = normalize(inputEl.value);

  if (!raw) {
    inputEl.classList.add('shake');
    setTimeout(() => inputEl.classList.remove('shake'), 400);
    hint('请先输入一个中文词语吧～', 'warn');
    inputEl.focus();
    return;
  }

  if (charsOf(raw).length < 2) {
    inputEl.classList.add('shake');
    setTimeout(() => inputEl.classList.remove('shake'), 400);
    hint('请输入至少两个字的词语，比如「天气」～', 'warn');
    inputEl.focus();
    return;
  }

  nodes = [{ word: raw, who: 'user' }];
  used = new Set([raw]);

  const next = pickNext(raw);

  if (!next) {
    renderChain();
    hint(`词库里暂时找不到以「${lastChar(raw)}」开头的词语，换个词试试吧～`, 'warn');
    return;
  }

  nodes.push({ word: next, who: 'ai' });
  used.add(next);
  renderChain();
  hint(`接上啦！「${raw}」→「${next}」，可以点「继续接一步」接着玩。`, 'ok');
}

function stepFurther() {
  if (!nodes.length) return;

  const last = nodes[nodes.length - 1].word;
  const next = pickNext(last);

  if (!next) {
    hint(`接不下去啦，词库里没有以「${lastChar(last)}」开头的词了 😅`, 'warn');
    return;
  }

  nodes.push({ word: next, who: 'ai' });
  used.add(next);
  renderChain();
  hint(`「${last}」→「${next}」`, 'ok');
}

function reset() {
  nodes = [];
  used = new Set();
  chainEl.innerHTML = '';
  nextBtn.classList.add('hidden');
  resetBtn.classList.add('hidden');
  hint('');
  inputEl.value = '';
  inputEl.focus();
}

/* ---------------- 事件绑定 ---------------- */
goBtn.addEventListener('click', startChain);
nextBtn.addEventListener('click', stepFurther);
resetBtn.addEventListener('click', reset);

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') startChain();
});

inputEl.addEventListener('input', () => {
  if (hintEl.classList.contains('warn')) hint('');
});

window.addEventListener('load', () => inputEl.focus());
</script>
